<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guinée Bon Coin - Inscription</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #ff6600; text-align: center; }
        .input-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .optionnel { font-weight: normal; color: #777; font-size: 0.9em; }
        .btn {
            background-color: #ff6600;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover { background-color: #e55b00; }
        
        .separator {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #666;
            font-size: 14px;
        }
        .separator::before, .separator::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }
        .separator::before { left: 0; }
        .separator::after { right: 0; }

        .btn-social {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            background: white;
        }
        .btn-google { color: #db4437; }
        .btn-google:hover { background: #fdf2f2; }
        .btn-facebook { color: #4267B2; }
        .btn-facebook:hover { background: #f0f4f9; }

        #message { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Guinée Bon Coin</h2>
        
        <!-- Formulaire classique -->
        <form id="inscriptionForm">
            <div class="input-group">
                <label for="nom">Nom d'utilisateur :</label>
                <input type="text" id="nom" required placeholder="Ex: Mamadou">
            </div>

            <div class="input-group">
                <label for="telephone">Numéro de téléphone :</label>
                <input type="tel" id="telephone" required placeholder="Ex: +224 620 00 00 00">
            </div>

            <div class="input-group">
                <label for="email">Adresse Email <span class="optionnel">(Facultatif)</span> :</label>
                <input type="email" id="email" placeholder="Ex: mamadou@gmail.com">
            </div>

            <div class="input-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" required placeholder="Votre mot de passe secret">
            </div>

            <button type="submit" class="btn" id="submitBtn">S'inscrire</button>
        </form>

        <div class="separator">OU</div>

        <!-- Boutons Sociaux -->
        <button type="button" class="btn-social btn-google" onclick="connexionSociale('Google')">
            <span>🌐</span> Continuer avec Google
        </button>
        <button type="button" class="btn-social btn-facebook" onclick="connexionSociale('Facebook')">
            <span>📘</span> Continuer avec Facebook
        </button>

        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ylrqruogetpbvyfditjt.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlscXJ1b2dldHBidnlmZGl0anQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczODE0MzE4NCwiZXhwIjoyMDUzNzE5MTg0fQ.YOUR_SECRET_KEY_PART' // Mets ta vraie clé Supabase exacte ici
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        const form = document.getElementById('inscriptionForm')
        const messageDiv = document.getElementById('message')

        // Gestion du blocage des 3 tentatives (2 heures)
        function verifierBlocage() {
            const tempsBlocageFin = localStorage.getItem('blocage_fin')
            if (tempsBlocageFin) {
                const maintenant = new Date().getTime()
                if (maintenant < tempsBlocageFin) {
                    const minutesRestantes = Math.ceil((tempsBlocageFin - maintenant) / (1000 * 60))
                    form.style.display = 'none'
                    messageDiv.style.color = 'red'
                    messageDiv.textContent = `Trop d'échecs. Accès bloqué. Réessayez dans ${minutesRestantes} minute(s).`
                    return true
                } else {
                    localStorage.removeItem('blocage_fin')
                    localStorage.removeItem('tentatives')
                }
            }
            return false
        }

        verifierBlocage()

        // Inscription classique
        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            if (verifierBlocage()) return

            const nom = document.getElementById('nom').value.trim()
            const telephone = document.getElementById('telephone').value.trim()
            const email = document.getElementById('email').value.trim() || null
            const password = document.getElementById('password').value.trim()

            const telephoneNettoye = telephone.replace(/\s+/g, '')
            if (telephoneNettoye.length < 9) {
                gererEchec("Erreur : Numéro de téléphone invalide (9 chiffres minimum).")
                return
            }

            const { error } = await _supabase
                .from('utilisateurs')
                .insert([{ nom: nom, telephone: telephone, email: email, mot_de_passe: password }])

            if (error) {
                console.error("Erreur:", error)
                gererEchec("Erreur lors de l'inscription : " + error.message)
            } else {
                succesInscription()
            }
        })

        // Connexion sociale (Google / Facebook)
        async function connexionSociale(plateforme) {
            if (verifierBlocage()) return

            const nomSocial = prompt(`Entrez votre nom pour la connexion ${plateforme} :`)
            if (!nomSocial) return

            const telephoneSocial = prompt("Entrez votre numéro de téléphone (ex: +224...) :")
            if (!telephoneSocial) return

            const telNettoye = telephoneSocial.replace(/\s+/g, '')
            if (telNettoye.length < 9) {
                alert("Numéro de téléphone invalide (9 chiffres minimum).")
                gererEchec("Numéro social invalide")
                return
            }

            const { error } = await _supabase
                .from('utilisateurs')
                .insert([{ nom: `${nomSocial} (${plateforme})`, telephone: telephoneSocial, mot_de_passe: 'SOCIAL_LOGIN' }])

            if (error) {
                alert("Erreur lors de la connexion : " + error.message)
            } else {
                succesInscription()
            }
        }

        function succesInscription() {
            localStorage.removeItem('tentatives')
            localStorage.removeItem('blocage_fin')

            messageDiv.style.color = 'green'
            messageDiv.textContent = 'Connexion réussie ! Redirection...'
            form.reset()
            
            setTimeout(() => {
                window.location.href = 'accueil.html'
            }, 1000)
        }

        function gererEchec(messageTexte) {
            messageDiv.style.color = 'red'
            messageDiv.textContent = messageTexte

            let tentatives = parseInt(localStorage.getItem('tentatives') || '0') + 1
            localStorage.setItem('tentatives', tentatives)

            if (tentatives >= 3) {
                const deuxHeures = 2 * 60 * 60 * 1000
                const tempsFin = new Date().getTime() + deuxHeures
                localStorage.setItem('blocage_fin', tempsFin)
                
                alert("Trop de tentatives incorrectes. Votre accès est bloqué pendant 2 heures.")
                location.reload()
            }
        }
    </script>
</body>
</html>
