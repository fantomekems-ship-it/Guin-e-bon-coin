<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guinée Bon Coin - Inscription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #ff6600;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e55c00;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Guinée Bon Coin</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="nom">Nom complet :</label>
                <input type="text" id="nom" required placeholder="Ex: Mamadou Diallo">
            </div>
            
            <div class="form-group">
                <label for="telephone">Numéro de téléphone :</label>
                <input type="tel" id="telephone" required placeholder="Ex: +224 620 00 00 00">
            </div>

            <button type="submit">S'inscrire</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- Script de connexion Supabase -->
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'

        // Tes identifiants Supabase configurés
        const supabaseUrl = 'https://ylrqruogetpbvyfditjt.supabase.co'
        const supabaseKey = 'sb_publishable_12Iq5_yhPziBBV3CdxjgqA_AzUOskcd'
        const supabase = createClient(supabaseUrl, supabaseKey)

        const form = document.getElementById('signupForm')
        const messageDiv = document.getElementById('message')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const nom = document.getElementById('nom').value
            const telephone = document.getElementById('telephone').value

            messageDiv.style.color = '#333'
            messageDiv.textContent = 'Enregistrement en cours...'

            const { data, error } = await supabase
                .from('utilisateurs')
                .insert([{ nom: nom, telephone: telephone }])

                        if (error) {
                console.error("Erreur:", error)
                messageDiv.style.color = 'red'
                messageDiv.textContent = 'Erreur : ' + error.message
            } else {
                messageDiv.style.color = 'green'
                messageDiv.textContent = 'Inscription réussie ! Redirection...'
                form.reset()
                
                // Redirection automatique vers la page d'accueil après 1 seconde
                setTimeout(() => {
                    window.location.href = 'accueil.html'
                }, 1000)
            }

            }
        })
    </script>

</body>
</html>
