<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guinée Bon Coin - Petites annonces en Guinée</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- En-tête / Barre de navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            
            <!-- Logo et Nom -->
            <a href="index.html" class="flex items-center gap-3">
                <img src="Logo.png" alt="Logo Guinée bon coin" class="h-10 w-10 object-contain rounded-full shadow">
                <span class="text-lg font-bold tracking-tight text-gray-900">
                    Guinée <span class="text-red-600">bon</span> <span class="text-green-600">coin</span>
                </span>
            </a>

            <!-- Bouton Déposer une annonce -->
            <a href="#" class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition">
                + Déposer une annonce
            </a>

        </div>
    </header>

    <!-- Section principale -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center my-12">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4">
                Achetez et vendez en toute confiance en Guinée
            </h1>
            <p class="text-gray-600 max-w-xl mx-auto mb-8">
                Trouvez les meilleures bonnes affaires près de chez vous : immobilier, véhicules, téléphones et bien plus encore.
            </p>

            <!-- Barre de recherche rapide -->
            <div class="max-w-xl mx-auto bg-white p-2 rounded-xl shadow-md flex items-center border border-gray-200">
                <input type="text" placeholder="Que recherchez-vous ?" class="w-full px-4 py-2 focus:outline-none text-gray-700 text-sm">
                <button class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-medium text-sm transition">
                    Rechercher
                </button>
            </div>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="bg-white border-t border-gray-200 mt-16 py-6 text-center text-sm text-gray-500">
        &copy; 2026 Guinée Bon Coin. Tous droits réservés.
    </footer>

</body>
</html>
